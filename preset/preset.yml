schema_version: "1.0"
preset:
  id: "solo-orchestrator"
  name: "Solo Implementation Hook Ordering"
  version: "0.1.0"
  description: "Use native priority ordering before Core implementation."
  author: "Local Governance"
  license: "MIT"
requires:
  speckit_version: ">=0.16.2,<0.17.0"
provides:
  templates:
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      strategy: "prepend"
